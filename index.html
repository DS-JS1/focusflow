<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Focus Flow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Dryspace Focus Flow</title>
<meta name="theme-color" content="#0F1839">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg1:#0B1026;--bg2:#05070F;--ink:#E8ECFF;--muted:#9099C6;--accent:#3EE0FF;--accent2:#8B7BFF;
  --card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.085);--line:rgba(160,175,255,.15);
  --on-accent:#04121C;--sheet:#0F1531;--hdr:#0F1839;--track:rgba(160,175,255,.12);--danger:#FF8A8A;
  --c-dir:#8C9BFF;--c-quote:#3EE0C0;--c-jobs:#FFC247;--c-other:#FF7BA8;
  --m-focus:#8B7BFF;--m-tracker:#FF8F4D;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Azeret Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
body[data-theme=break]{
  --bg1:#23367A;--bg2:#101A45;--ink:#F0F4FF;--muted:#AEBBE8;--accent:#7CF5C8;--accent2:#9DB4FF;
  --card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(200,215,255,.2);
  --on-accent:#062A1F;--sheet:#1A2860;--hdr:#314C98;--track:rgba(200,215,255,.16);
}
body[data-theme=tracker]{
  --bg1:#C2521B;--bg2:#7A2E0E;--ink:#FFF4E6;--muted:#FFD3B0;--accent:#FFE8C7;--accent2:#FFB547;
  --card:rgba(60,16,0,.26);--card2:rgba(60,16,0,.36);--line:rgba(255,220,190,.22);
  --on-accent:#6B2508;--sheet:#6E2A0C;--hdr:#D8622A;--track:rgba(255,230,205,.2);--danger:#FFC2B0;
  --m-tracker:#FFB547;
}
html,body{height:100%}
body{margin:0;background:var(--bg2);color:var(--ink);font:15px/1.5 var(--f-body);transition:background-color .6s,color .4s;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.bg.focus{background:radial-gradient(120% 65% at 50% 0%,#172255 0%,#0B1026 48%,#05070F 100%)}
.bg.break{background:radial-gradient(120% 65% at 50% 0%,#3A57A8 0%,#23367A 50%,#101A45 100%)}
.bg.tracker{background:radial-gradient(120% 65% at 50% 0%,#E36C2C 0%,#C2521B 46%,#7A2E0E 100%)}
body[data-theme=focus] .bg.focus,body[data-theme=break] .bg.break,body[data-theme=tracker] .bg.tracker{opacity:1}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:22px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:700 11px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:12px;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--hdr) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:background-color .6s,border-color .3s}
header.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:inherit}
header.top.scrolled{border-bottom-color:var(--line);box-shadow:0 10px 24px -18px rgba(0,0,0,.6)}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0;line-height:1}
.brand small{font:800 10px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.brand span{font:800 20px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.logo{margin-left:auto;flex:none;display:grid;place-items:center;height:40px;padding:0 10px;border-radius:12px;background:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}
.logo img{display:block;height:24px;width:auto;max-width:34vw;object-fit:contain}
@media (max-width:360px){.logo{padding:0 8px;height:34px}.logo img{height:18px}.brand span{font-size:18px}}
.pill{order:9;flex-basis:100%;justify-content:center;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.pill b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.pd{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.tracker .pd{background:var(--m-tracker)}
.pill.focus .pd{background:#3EE0FF}
.pill.break .pd{background:#7CF5C8}
.pd.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
main{flex:1;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg2) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);transition:background-color .6s}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-inline:8px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding-block:10px 8px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);min-height:58px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}

/* mode switch */
.modeswitch{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.modeswitch .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:16px;background:var(--card2);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .45s cubic-bezier(.6,.05,.25,1)}
.modeswitch[data-m=tracker] .thumb{transform:translateX(100%)}
.modeswitch button{position:relative;z-index:1;padding:10px 8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.modeswitch button b{font:700 16px var(--f-display)}
.modeswitch button small{font-size:11px;color:var(--muted);font-weight:600}
.modeswitch button[aria-pressed=true] b{color:var(--accent)}

/* task chip */
.taskchip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-height:60px}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}
.tc-text{flex:1;min-width:0;display:flex;flex-direction:column}
.tc-text small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tc-text b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-act{font-size:12px;font-weight:700;color:var(--accent);padding:6px 10px;border-radius:10px;background:var(--card2)}

/* ring */
.ringwrap{position:relative;width:min(80vw,300px);max-width:100%;aspect-ratio:1;margin:4px auto 0}
.ring{width:100%;height:100%;display:block;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 30%,transparent))}
.ring-track{fill:none;stroke:var(--track);stroke-width:12}
.ring-prog{fill:none;stroke:url(#rg);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring-knob{fill:var(--ink);stroke:var(--accent);stroke-width:3}
.tick{stroke:var(--line);stroke-width:1.5}
.tick.major{stroke:var(--muted);stroke-width:2;opacity:.6}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.digits{font:300 clamp(52px,17vw,70px)/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.digits.long{font-size:clamp(40px,12.5vw,54px)}
.ringsub{font-size:13px;color:var(--muted);font-weight:600}
.state{font:700 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}

.dots{display:flex;justify-content:center;gap:8px}
.dots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);opacity:.7}
.dots span.on{background:var(--accent);border-color:var(--accent);opacity:1}

.dur{display:flex;flex-direction:column;gap:8px}
.durhead{display:flex;justify-content:space-between;align-items:baseline}
.durhead label{font-weight:700;font-size:13px;color:var(--muted)}
.durhead output{font:500 15px var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.presets{display:flex;gap:8px}
.presets button{flex:1;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.presets button.on{border-color:var(--accent);color:var(--accent)}

.controls{display:flex;align-items:flex-start;justify-content:center;gap:28px}
.ctlwrap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.ctl{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);transition:transform .15s}
.ctl:active{transform:scale(.94)}
.ctl.main{width:88px;height:88px;background:var(--accent);color:var(--on-accent);border:0;box-shadow:0 12px 40px -12px var(--accent)}
.ctl:disabled{opacity:.35;cursor:default}
.ctl svg{width:26px;height:26px}
.ctl.main svg{width:34px;height:34px}

.note{width:100%}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font:700 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.mini span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}

.msgcard{padding:16px 18px;border-radius:20px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;animation:rise .5s ease both}
.msgcard .msg{font:600 19px/1.35 var(--f-display)}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}

/* forms */
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font:500 15px var(--f-body)}
textarea{font:400 12px/1.5 var(--f-mono);resize:vertical}
select option{background:var(--sheet);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.8}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:rgba(255,90,90,.14);color:var(--danger);border:1px solid rgba(255,120,120,.3)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.actions{display:flex;flex-direction:column;gap:10px}

.card{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.banner{padding:12px 14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);display:flex;gap:12px;align-items:center;font-size:13px}
.banner p{flex:1}
.banner button{font-weight:800;color:var(--accent);font-size:13px;padding:6px 4px}

/* dashboard */
.rangebar{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rangebar button{flex:1;height:38px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted)}
.rangebar button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.total{display:flex;flex-direction:column;gap:10px}
.total .big{font:800 clamp(44px,14vw,60px)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.total .big small{font-size:.45em;font-weight:600;color:var(--muted);margin-left:2px;margin-right:8px}
.splitbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--track)}
.splitbar span{display:block;height:100%}
.splitlegend{display:flex;gap:16px;font-size:13px;font-weight:600;flex-wrap:wrap}
.splitlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donutrow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.donutrow{grid-template-columns:1fr}.donutrow svg{max-width:180px;margin:auto}}
.donut .seg{transition:opacity .3s;cursor:pointer}
.donut .seg.dim{opacity:.22}
.legend{display:flex;flex-direction:column;gap:4px}
.legend button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:600}
.legend button.on{background:var(--card2)}
.legend button.dim{opacity:.45}
.legend .v{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.legend .pc{color:var(--muted);font-size:11px;margin-left:4px}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:flex;flex-direction:column;gap:5px}
.barrow .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.barrow .lbl span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .lbl .v{font:500 13px var(--f-mono);flex:none}
.barrow .track{height:8px;border-radius:5px;background:var(--track);overflow:hidden;display:flex}
.barrow .track span{display:block;height:100%}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:600 10px var(--f-body)}
.tl{position:relative;display:flex;flex-direction:column;gap:8px}
.tlrow{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.tltrack{position:relative;height:26px;border-radius:8px;background:var(--track)}
.tltrack span{position:absolute;top:3px;bottom:3px;border-radius:5px;min-width:3px}
.tlaxis{position:relative;height:16px;margin-left:64px;font:500 10px var(--f-mono);color:var(--muted)}
.tlaxis span{position:absolute;transform:translateX(-50%)}
.tlnow{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}

/* stats */
.streak{display:flex;align-items:center;gap:18px}
.streak .n{font:800 76px/0.9 var(--f-display);letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.streak .t{display:flex;flex-direction:column;gap:4px}
.streak .t b{font:700 18px var(--f-display)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekstrip div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.weekstrip i{width:100%;aspect-ratio:1;max-width:40px;border-radius:12px;background:var(--track);display:grid;place-items:center;font-style:normal;color:var(--on-accent)}
.weekstrip i.done{background:var(--accent)}
.weekstrip i.we{background:transparent;border:1px dashed var(--line)}
.weekstrip i.we.done{background:color-mix(in srgb,var(--accent) 40%,transparent);border:0}
.weekstrip i.today{box-shadow:0 0 0 2px var(--ink)}
.heat{display:grid;grid-template-columns:22px repeat(12,1fr);gap:4px;align-items:center}
.heat .dl{font-size:9px;font-weight:700;color:var(--muted)}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--track)}
.heat .c.l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.heat .c.l2{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.heat .c.l3{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.heat .c.l4{background:var(--accent)}
.heat .c.fut{background:transparent}
.heatkey{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--muted);font-weight:600}
.heatkey .c{width:12px;height:12px;border-radius:3px}

/* log */
.daygrp{display:flex;flex-direction:column;gap:6px}
.dayhead{display:flex;justify-content:space-between;padding:0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.logrow{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.logrow .m{display:flex;flex-direction:column;min-width:0}
.logrow b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow small{font-size:12px;color:var(--muted);font-weight:600}
.logrow em{font-style:normal;font-size:12px;color:var(--ink);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .d{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-right:6px;vertical-align:1px}
.tag.focus{background:rgba(139,123,255,.25);color:#CFC8FF}
.tag.tracker{background:rgba(255,143,77,.25);color:#FFD2B5}
.tag.partial{background:var(--card2);color:var(--muted)}
.tag.manual{background:var(--card2);color:var(--ink)}

/* settings */
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:44px}
.setrow > span{flex:1 1 150px}
.setrow > span{font-weight:600;font-size:14px}
.setrow select{width:auto;min-width:110px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:background .25s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .25s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(22px);background:var(--on-accent)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.adhocrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:600}
.adhocrow button{color:var(--danger);font-size:13px;font-weight:700;padding:6px}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(2,3,10,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.overlay.open{opacity:1}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--sheet);color:var(--ink);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.overlay.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.overlay.drawer{justify-content:flex-start;align-items:stretch}
.overlay.drawer .sheet{max-width:300px;max-height:none;height:100%;border-radius:0 26px 26px 0;border:1px solid var(--line);border-left:0;transform:translateX(-40px);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:calc(18px + env(safe-area-inset-left,0px));width:min(300px,86vw)}
.overlay.drawer.open .sheet{transform:none}
.overlay.drawer .grab{display:none}
.navlist{display:flex;flex-direction:column;gap:4px}
.navlist button{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;font-weight:700;font-size:16px;text-align:left}
.navlist button.on{background:var(--card2);color:var(--accent)}
.navlist svg{width:22px;height:22px;flex:none}
.navlist .sw{width:12px;height:12px;border-radius:4px;margin:0 5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700;max-width:100%}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cdot{width:8px;height:8px}
.cattabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cattab{padding:10px 4px;border-radius:12px;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.cattab.on{color:var(--ink);border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.tasklist{display:flex;flex-direction:column;gap:6px}
.taskrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:52px}
.taskrow.on{border-color:var(--accent);color:var(--accent)}
.adhocform{display:flex;gap:8px}
.err{color:var(--danger);font-size:13px;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,20px);width:min(440px,calc(100% - 32px));padding:14px 16px;border-radius:18px;background:var(--sheet);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .tt{font:700 17px/1.3 var(--f-display);margin-top:2px}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:35;width:min(440px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--sheet);border:1px solid var(--accent);font-size:13px;font-weight:600;box-shadow:0 16px 40px -18px rgba(0,0,0,.7)}
.updbar span{flex:1}
.updbar button{flex:none;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:800}
.hint{font-size:12px;color:var(--muted);text-align:center;font-weight:600;margin-top:-4px}
.howto{border-top:1px solid var(--line);padding-top:10px}
.howto summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style-position:inside}
.howto ol{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.testbar{font-size:12px;font-weight:700;text-align:center;padding:6px;border-radius:10px;background:var(--card2);color:var(--accent)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

<script>
/* ---------- constants ---------- */
const MENU={
  Directors:['Finance Review','Planning (Looking Forward)','Review (Looking Back)','Sales Review','Big Picture/Direction','Process Design','App Dev'],
  Quote:['Spec and Design','Proposal Writing','Pricing','Planning'],
  Jobs:['Packlist Prep','Job Flow Planning','ClockShark Scheduling','Timesheet Review'],
  Other:[]
};
const CATS=['Directors','Quote','Jobs','Other'];
const CATVAR={Directors:'var(--c-dir)',Quote:'var(--c-quote)',Jobs:'var(--c-jobs)',Other:'var(--c-other)'};
const TEST=location.hash==='#test';
const MIN=TEST?1000:60000;            // one "minute" of timer
const TRACK_MIN_SAVE=TEST?5000:60000; // shortest tracker entry worth saving
const KEY='focusflow.v1';
const DAY=86400000;

const FOCUS_MSG=[
  '{min} minutes on {task}. That is real progress.',
  'Deep work banked. Stand up, stretch, look out a window.',
  'One more block done. The business moves forward in blocks like this.',
  'Distraction-free and done. Nice work.',
  '{task}: {min} minutes of full attention. It adds up.',
  'Session {n} complete. Keep the rhythm going.',
  'Focused time is the scarcest thing you have. You just spent it well.',
  'Good stopping point. Let the thinking settle during the break.',
  'That makes {today} of focus today.',
  'Done beats perfect. Session logged.',
  'You showed up and did the work. Enjoy the break.',
  'Clear head, clear work. Take a breather.'
];
const TRACK_MSG=[
  '{dur} logged to {task}.',
  'Now you know where that time went: {task}.',
  'Tracked and saved. Seeing the time is half of controlling it.',
  '{dur} on {task}. All logged today: {today}.',
  'Logged. Every hour you count is an hour you can plan.',
  'Saved. Your dashboard just got a little clearer.',
  'Good work on {task}. On to the next thing.',
  'Time you can see is time you can manage. {dur} saved.'
];
const BREAK_MSG=[
  'Break is over. Ready for session {next}?',
  'Recharged. Pick up where you left off.',
  'Back to it. One focused block at a time.',
  'Break done. Phone face down, head in.',
  'Time to focus. You have got this.',
  'Break complete. Make the next one count.'
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function sod(d){d=new Date(d);d.setHours(0,0,0,0);return d}
function addDays(d,n){d=new Date(d);d.setDate(d.getDate()+n);return d}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isWE(d){d=new Date(d);const w=d.getDay();return w===0||w===6}
function monday(d){d=sod(d);const w=(d.getDay()+6)%7;return addDays(d,-w)}
function fmtClock(ms,forceH,up){
  let s=up?Math.floor(ms/1000):Math.ceil(ms/1000);s=Math.max(0,s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h||forceH)?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x);
}
function fmtDur(sec){
  sec=Math.round(sec||0);
  if(!sec)return "0m";
  if(sec<60)return sec+"s";
  const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);
  if(!h)return m+'m';
  return h+'h'+(m?' '+m+'m':'');
}
function fmtTime(ts){const d=new Date(ts);let h=d.getHours();const ap=h<12?'am':'pm';h=h%12||12;return h+':'+pad(d.getMinutes())+ap}
function hhmm(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDay(ts){const d=new Date(ts);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(_,k)=>o[k]??'')}

/* ---------- state ---------- */
function defaults(){return{
  v:1,entries:[],adhoc:[],recent:[],hasSample:false,
  settings:{focusMin:25,shortMin:5,longMin:15,longEvery:4,autoBreak:true,sound:true,tone:'bowl',volume:.4,vibrate:true,repeat:2,notify:false,lockScreen:false,userName:'',pad:'off',padVol:.8,clock:false,clockName:'Focus Flow Timer'},
  task:{focus:null,tracker:null},notes:{focus:'',tracker:''},
  active:null,msg:null,cycle:{date:'',n:0},
  ui:{mode:'focus',view:'timer',range:'week',cat:null,cfrom:'',cto:'',logLimit:40}
}}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw),b=defaults();
      return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings),ui:Object.assign(b.ui,d.ui),task:Object.assign(b.task,d.task),notes:Object.assign(b.notes,d.notes)});
    }
  }catch(e){}
  const d=defaults();d.entries=sampleEntries();d.hasSample=true;return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function sampleEntries(){
  let seed=11;const r=()=>(seed=seed*16807%2147483647)/2147483647;
  const pk=a=>a[Math.floor(r()*a.length)];
  const out=[],today=sod(new Date()),now=Date.now();
  for(let i=20;i>=0;i--){
    const d=addDays(today,-i);const we=isWE(d);
    if(we&&r()>.3)continue;
    let ts=new Date(d).setHours(we?9:7,20+Math.floor(r()*40),0,0);
    const n=we?1:3+Math.floor(r()*3);
    for(let k=0;k<n;k++){
      const cat=pk(['Directors','Directors','Quote','Quote','Jobs','Jobs','Jobs','Other']);
      const task=cat==='Other'?pk(['Supplier meeting','Insurance renewal']):pk(MENU[cat]);
      const focus=r()<.55;
      const min=focus?pk([25,25,30,45,50]):15+Math.floor(r()*95);
      const end=ts+min*60000;
      if(end>now)break;
      out.push({id:uid()+k,mode:focus?'focus':'tracker',cat,task,start:ts,end,sec:min*60,completed:focus&&r()>.1,note:'',sample:true});
      ts=end+(10+Math.floor(r()*50))*60000;
    }
  }
  return out;
}

let S=load();
if(S.hasSample&&S.adhoc.length===0){S.adhoc=['Supplier meeting','Insurance renewal']}

function elapsed(a=S.active){if(!a)return 0;return a.accum+(a.runStart?Date.now()-a.runStart:0)}
function cycleToday(){const k=dayKey(Date.now());if(S.cycle.date!==k)S.cycle={date:k,n:0};return S.cycle}
function sumSec(list){return list.reduce((t,e)=>t+e.sec,0)}
function todayEntries(){const f=sod(new Date()).getTime();return S.entries.filter(e=>e.start>=f&&e.start<f+DAY)}

function addEntry(e){
  if(S.hasSample){
    S.entries=S.entries.filter(x=>!x.sample);S.hasSample=false;
    setTimeout(()=>toast('Sample data cleared. Your real log starts now.'),2600);
  }
  S.entries.push(e);
}
function pushRecent(t){
  S.recent=[t,...S.recent.filter(x=>!(x.cat===t.cat&&x.name===t.name))].slice(0,6);
}

/* ---------- sound / alerts ---------- */
let AC=null;
function ac(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  return AC;
}
document.addEventListener('pointerdown',()=>ac(),{passive:true});
// out: master gain node; atk: fade-in seconds (longer = gentler onset)
function beep(c,out,f,t,dur,type,g,atk=.015){
  const o=c.createOscillator(),gn=c.createGain();
  o.type=type;o.frequency.value=f;
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+atk);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(out);o.start(t);o.stop(t+dur+.05);
}
const TONES=[
  ['bowl','Singing bowl','Gentle'],['chime','Wind chime','Gentle'],['marimba','Marimba','Gentle'],['pulse','Soft hum','Gentle'],
  ['bell','Bright bell','Standard'],['soft','Warm tone','Standard'],['digital','Digital beep','Standard']
];
const VOLUMES=[[.2,'Whisper'],[.4,'Quiet'],[.7,'Medium'],[1,'Loud'],[1.8,'Extra loud']];
function sound(kind,force){
  if(!S.settings.sound&&!force)return;
  const c=ac();if(!c)return;
  const t=c.currentTime+.03,tone=S.settings.tone;
  const vol=S.settings.volume??.4,out=c.createGain();out.gain.value=vol;
  if(vol>1){const k=c.createDynamicsCompressor();k.threshold.value=-18;k.ratio.value=8;out.connect(k).connect(c.destination)}  // boost without distortion
  else out.connect(c.destination);
  if(tone==='bowl'){
    // one or two slow strikes of a low bowl: detuned pair gives the soft shimmer
    const f={focus:196,break:174.6,tracker:220,test:196}[kind];
    const strikes=kind==='focus'?[0,2.4]:[0];
    strikes.forEach(d=>{beep(c,out,f,t+d,5.5,'sine',.28,.08);beep(c,out,f*1.005,t+d,5.5,'sine',.18,.08);beep(c,out,f*2.71,t+d,3,'sine',.05,.06)});
    return;
  }
  if(tone==='pulse'){
    // two slow, low swells with no hard edge at all
    const f=kind==='break'?164.8:130.8;
    [0,1.3].forEach(d=>beep(c,out,f,t+d,1.4,'sine',.3,.6));
    return;
  }
  const seq={focus:[[523.25,0],[659.25,.16],[783.99,.32],[1046.5,.5]],break:[[783.99,0],[587.33,.24],[783.99,.48]],tracker:[[659.25,0],[880,.15]],test:[[659.25,0],[880,.16],[1046.5,.32]]}[kind];
  seq.forEach(([f,d])=>{
    if(tone==='chime'){beep(c,out,f*2,t+d*2.2,2.8,'sine',.07,.02);beep(c,out,f*3.01,t+d*2.2+.05,1.6,'sine',.02,.02)}
    else if(tone==='marimba'){beep(c,out,f/2,t+d*1.4,.7,'sine',.3,.005);beep(c,out,f*2,t+d*1.4,.15,'sine',.05,.005)}
    else if(tone==='digital'){beep(c,out,f*1.5,t+d,.12,'square',.07);beep(c,out,f*1.5,t+d+.08,.1,'square',.05)}
    else if(tone==='soft'){beep(c,out,f/2,t+d,1.1,'triangle',.35)}
    else{beep(c,out,f,t+d,1.6,'sine',.32);beep(c,out,f*2.01,t+d,.7,'sine',.08)}
  });
}
function buzz(){if(!S.settings.vibrate)return;try{navigator.vibrate&&navigator.vibrate([220,120,220])}catch(e){}}
function notify(title,body){
  if(!S.settings.notify)return;
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,icon:'icon-192.png'})}catch(e){}
}
// iPhone: the 'playback' audio session plays even when the ring/silent switch is on silent
function audioSession(type){try{if(navigator.audioSession)navigator.audioSession.type=type}catch(e){}}
// End-of-timer alert, repeated until the user taps the screen (or the repeats run out)
let alertTimers=[];
function stopAlert(){alertTimers.forEach(clearTimeout);alertTimers=[]}
function alertEnd(kind){
  stopAlert();audioSession('playback');
  const reps=kind==='focus'&&S.settings.clock?0:(S.settings.repeat||0);
  sound(kind);buzz();
  for(let i=1;i<=reps;i++)alertTimers.push(setTimeout(()=>{sound(kind);buzz()},i*9000));
  alertTimers.push(setTimeout(()=>{if(!S.settings.lockScreen)audioSession('auto')},reps*9000+7000));
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(alertTimers.length)stopAlert()},{passive:true}));

/* ---------- lock-screen timer ----------
   Playing a silent, looping audio track makes the phone show a "now playing" card on the lock
   screen. We fill that card with the timer (title, task, progress bar, play/pause). It also keeps
   the page running in the background, so end-of-timer sounds play while the phone is locked. */
let lockAudio=null,lockMetaKey='';
function silentWavUrl(){
  const rate=8000,n=rate,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function lockSetup(){
  if(lockAudio)return lockAudio;
  lockAudio=new Audio(silentWavUrl());lockAudio.loop=true;lockAudio.setAttribute('playsinline','');
  if('mediaSession' in navigator){
    const ms=navigator.mediaSession;
    const h=(act,fn)=>{try{ms.setActionHandler(act,fn)}catch(e){}};
    h('play',()=>{const a=S.active;if(a&&!a.runStart)toggle(a);else syncLock()});
    h('pause',()=>{const a=S.active;if(a&&a.runStart)toggle(a);else syncLock()});
    ['seekto','seekbackward','seekforward','previoustrack','nexttrack'].forEach(x=>h(x,null));
  }
  return lockAudio;
}
function syncLock(){
  const a=S.active,on=a&&(S.settings.lockScreen||padVoice);
  if(!on){
    if(lockAudio&&!lockAudio.paused)lockAudio.pause();
    if(lockMetaKey&&'mediaSession' in navigator){try{navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}catch(e){}}
    lockMetaKey='';return;
  }
  const el=lockSetup();
  if(S.settings.lockScreen&&!padVoice){
    if(a.runStart&&el.paused)el.play().catch(()=>{});
    if(!a.runStart&&!el.paused)el.pause();
  }else if(!el.paused)el.pause();
  if(!('mediaSession' in navigator))return;
  const ms=navigator.mediaSession,e=elapsed(a);
  const label=a.mode==='tracker'?'Time Tracker':a.mode==='break'?(a.kind==='long'?'Long break':'Short break'):'Focus';
  let sub;
  if(a.mode==='tracker')sub=`Since ${fmtTime(a.startedAt)} · ${fmtDur(e/1000)} so far`;
  else{const left=Math.max(0,Math.ceil((a.target-e)/MIN));sub=`${left} min left${a.mode==='break'?'':' · ends '+fmtTime(Date.now()+(a.target-e)/MIN*60000)}`}
  const title=`${label}${a.task?' · '+a.task.name:''}`;
  const key=title+sub+(a.runStart?1:0);
  if(key!==lockMetaKey){
    lockMetaKey=key;
    try{ms.metadata=new MediaMetadata({title,artist:sub,album:'Dryspace Focus Flow',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'},{src:'icon-192.png',sizes:'192x192',type:'image/png'}]})}catch(err){}
    try{ms.playbackState=a.runStart?'playing':'paused'}catch(err){}
    try{
      // progress bar: countdown uses the session length, tracker fills to the next whole hour
      const sec=e/1000*(a.mode==='tracker'?1:60000/MIN);
      const dur=a.mode==='tracker'?Math.ceil((sec+1)/3600)*3600:a.target/MIN*60;
      ms.setPositionState({duration:dur,position:Math.min(sec,dur),playbackRate:a.runStart?1:0});
    }catch(err){}
  }
}
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function releaseWake(){try{wl&&wl.release()}catch(e){}wl=null}

let toastT;
function toast(text,title){
  const t=$('#toast');
  t.innerHTML=title?`<p class="eyebrow">${esc(title)}</p><p class="tt">${esc(text)}</p>`:esc(text);
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),title?5200:3000);

/* ---------- focus sound: Deep pad ----------
   A slowly shifting low chord, generated live. It plays only while a focus session is running
   and fades in and out. It goes through an <audio> element so the phone treats it as media:
   that gives the lock-screen card and keeps the app (and its alerts) running while locked. */
let padVoice=null,padEl=null,padOut=null;
const PAD_VOLUMES=[[.5,'Quiet'],[.8,'Medium'],[1.15,'Loud']];
function padSetup(){
  const c=ac();if(!c)return null;
  if(!padOut){
    padOut=c.createGain();padOut.gain.value=S.settings.padVol;
    try{
      const dest=c.createMediaStreamDestination();padOut.connect(dest);
      padEl=new Audio();padEl.setAttribute('playsinline','');padEl.srcObject=dest.stream;
    }catch(e){padEl=null;padOut.connect(c.destination)}
  }
  return c;
}
function padVoiceNodes(c,out,keep){
  const osc=(f,type,cents)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=cents;o.start();keep.push(o);return o};
  const lfo=(rate,depth,param)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g).connect(param);o.start();keep.push(o)};
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;lp.Q.value=.7;
  const bus=c.createGain();bus.gain.value=.2;lp.connect(bus).connect(out);
  // soft echo for space
  const dl=c.createDelay(2),fb=c.createGain(),df=c.createBiquadFilter();dl.delayTime.value=.7;fb.gain.value=.3;df.type='lowpass';df.frequency.value=1800;
  bus.connect(dl);dl.connect(df).connect(fb).connect(dl);fb.connect(out);
  [73.42,110,146.83,174.61,220].forEach((f,i)=>{   // D minor: D2 A2 D3 F3 A3
    [-4,4].forEach(cents=>{
      const g=c.createGain();g.gain.value=.12;osc(f,i%2?'triangle':'sine',cents).connect(g).connect(lp);
      lfo(.018+i*.011,.09,g.gain);
    });
  });
  lfo(.013,230,lp.frequency);
}
function padStart(){
  const c=padSetup();if(!c||padVoice)return;
  const out=c.createGain(),t=c.currentTime;out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(1,t+3);out.connect(padOut);
  const keep=[];padVoiceNodes(c,out,keep);padVoice={out,keep};
  if(padEl&&padEl.paused)padEl.play().catch(()=>{
    // media element refused: play straight to the speakers instead
    try{padOut.disconnect()}catch(e){}padEl=null;padOut.connect(c.destination);
  });
}
function padStop(secs=2.5){
  const v=padVoice;if(!v||!AC)return;padVoice=null;
  const t=AC.currentTime;v.out.gain.cancelScheduledValues(t);v.out.gain.setValueAtTime(v.out.gain.value,t);v.out.gain.linearRampToValueAtTime(0,t+secs);
  setTimeout(()=>{
    try{v.out.disconnect()}catch(e){}v.keep.forEach(n=>{try{n.stop()}catch(e){}});
    if(!padVoice&&padEl&&!padEl.paused)padEl.pause();
  },secs*1000+200);
}
let padPreviewT=null;
function padWanted(){const a=S.active;return S.settings.pad!=='off'&&a&&a.mode==='focus'&&!!a.runStart}
function syncPad(){
  if(padPreviewT)return;
  if(padWanted()&&!padVoice)padStart();else if(!padWanted()&&padVoice)padStop();
}
function previewPad(){
  clearTimeout(padPreviewT);
  if(padVoice&&!padPreviewT){toast('The Deep pad is already playing.');return}
  padStart();toast('Playing the Deep pad for 12 seconds.');
  padPreviewT=setTimeout(()=>{padPreviewT=null;if(!padWanted())padStop(3)},12000);
}
function setPadVol(v){S.settings.padVol=+v;save();if(padOut&&AC)padOut.gain.setTargetAtTime(+v,AC.currentTime,.1)}

/* ---------- iPhone Clock timer pairing ----------
   Runs a user-made Apple Shortcut that starts the Clock app's timer. The Clock timer keeps
   Apple Music playing, shows a live countdown on the lock screen and rings when time is up. */
function runClock(min){
  const name=(S.settings.clockName||'').trim()||'Focus Flow Timer';
  const url='shortcuts://run-shortcut?name='+encodeURIComponent(name)+'&input=text&text='+encodeURIComponent(String(min));
  try{location.href=url}catch(e){}
}
function testClock(){
  if(!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)){toast('Shortcuts is on iPhone and iPad. Try this from your phone.');return}
  runClock(1);
}
function breakMinLeft(){const a=S.active;return a?Math.max(1,Math.ceil((a.target-elapsed(a))/MIN)):S.settings.shortMin}

/* ---------- timer actions ---------- */
let pending=null;
function setMode(m){S.ui.mode=m;save();render()}
function go(v,m){if(m)S.ui.mode=m;S.ui.view=v;save();render();window.scrollTo(0,0)}
function goActive(){const a=S.active;if(!a)return;go('timer',a.mode==='tracker'?'tracker':'focus')}

function withTask(mode,fn){
  if(S.task[mode])return fn();
  openPicker(t=>{setTask(mode,t,true);fn()},null);
}
function play(){
  const vm=S.ui.mode,a=S.active;ac();
  if(vm==='focus'){
    if(a&&(a.mode==='focus'||a.mode==='break'))return toggle(a);
    if(a&&a.mode==='tracker')return conflict('focus',()=>withTask('focus',startFocus));
    withTask('focus',startFocus);
  }else{
    if(a&&a.mode==='tracker')return toggle(a);
    if(a)return conflict('tracker',()=>withTask('tracker',startTracker));
    withTask('tracker',startTracker);
  }
}
function toggle(a){
  if(a.runStart){a.accum+=Date.now()-a.runStart;a.runStart=null;releaseWake()}
  else{a.runStart=Date.now();wake()}
  save();render();
  if(S.settings.clock&&a.mode==='focus')toast(a.runStart?'Resumed. Resume the Clock timer from your lock screen too.':'Paused. Pause the Clock timer from your lock screen too.');
}
function startFocus(){
  const m=S.settings.focusMin,now=Date.now();
  S.active={mode:'focus',task:{...S.task.focus},min:m,target:m*MIN,accum:0,runStart:now,startedAt:now};
  S.msg=null;save();render();wake();

function startTracker(){

}
function focusSecFrom(ms){return Math.round(ms/MIN*60)}

function completeFocus(){
  const a=S.active,now=Date.now(),over=Math.max(0,elapsed(a)-a.target);
  const e={id:uid(),mode:'focus',cat:a.task.cat,task:a.task.name,start:a.startedAt,end:now-over,sec:a.min*60,completed:true,note:S.notes.focus||''};
  addEntry(e);S.notes.focus='';
  const c=cycleToday();c.n++;
  const long=c.n%S.settings.longEvery===0;
  const bmin=long?S.settings.longMin:S.settings.shortMin;
  S.active={mode:'break',kind:long?'long':'short',min:bmin,target:bmin*MIN,accum:0,runStart:S.settings.autoBreak?now:null,startedAt:now};
  const todayFocus=sumSec(todayEntries().filter(x=>x.mode==='focus'));
  S.msg={title:long?`${c.n} sessions done. Take ${bmin} minutes.`:`Session ${c.n} complete`,
         text:fill(pick(FOCUS_MSG),{min:a.min,task:a.task.name,n:c.n,today:fmtDur(todayFocus)})};
  S.ui.mode='focus';S.ui.view='timer';
  const padWas=!!padVoice;save();render();setTimeout(()=>alertEnd('focus'),padWas?2600:0);notify('Focus session complete',S.msg.text);
  if(!S.settings.autoBreak)releaseWake();
}
function completeBreak(){
  S.active=null;S.msg=null;save();
  alertEnd('break');

  notify('Break over',text);releaseWake();render();toast(text,'Break over');
}

function resetFocus(){
  const a=S.active;
  if(!a||a.mode!=='focus'){render();return}
  const el=elapsed(a);
  if(el<MIN){S.active=null;save();releaseWake();render();return}
  openSheet(`<p class="eyebrow">Reset focus session</p><h3>Keep the ${fmtDur(focusSecFrom(el))} you've done?</h3>
  <p class="muted">A partial session is saved to your log and dashboard. It won't count toward your streak.</p>
  <div class="actions"><button class="btn primary" onclick="closeSheet();endFocusEarly(true)">Save as partial session</button>
  <button class="btn danger" onclick="closeSheet();endFocusEarly(false)">Discard it</button>
  <button class="btn ghost" onclick="closeSheet()">Keep going</button></div>`);
}
function endFocusEarly(keep){
  const a=S.active;if(!a||a.mode!=='focus')return;
  const el=elapsed(a);
  if(keep&&el>=MIN){addEntry({id:uid(),mode:'focus',cat:a.task.cat,task:a.task.name,start:a.startedAt,end:Date.now(),sec:focusSecFrom(el),completed:false,note:S.notes.focus||''});S.notes.focus=''}
  S.active=null;save();releaseWake();render();
  if(keep&&el>=MIN)toast(`Saved ${fmtDur(focusSecFrom(el))} on ${a.task.name} as a partial session.${S.settings.clock?' Cancel the Clock timer from your lock screen.':''}`);
  else if(S.settings.clock)toast('Session reset. Cancel the Clock timer from your lock screen.');
}
function stopTracker(silent){
  const a=S.active;if(!a||a.mode!=='tracker')return;
  const el=elapsed(a);S.active=null;releaseWake();
  if(el<TRACK_MIN_SAVE){save();render();if(!silent)toast('Under a minute, so nothing was saved.');return}
  const sec=Math.round(el/1000);
  addEntry({id:uid(),mode:'tracker',cat:a.task.cat,task:a.task.name,start:a.startedAt,end:Date.now(),sec,completed:false,note:S.notes.tracker||''});
  S.notes.tracker='';save();render();
  if(!silent){

function conflict(target,then){

  pending=then;
  const desc=isT?`The Time Tracker has run for ${fmtClock(el,true,true)} on ${esc(a.task.name)}.`
               :`Focus has ${fmtClock(a.target-el)} left on ${esc(a.task.name)}.`;
  const act=isT?`Save ${fmtDur(el/1000)} and start Focus`:`Save ${fmtDur(focusSecFrom(el))} as partial and start tracking`;
  openSheet(`<p class="eyebrow">One timer at a time</p><h3>${isT?'The Time Tracker':'A focus session'} is running</h3>
  <p class="muted">${desc} Starting ${target==='focus'?'Focus':'the Tracker'} stops it and saves the time so far.</p>
  <div class="actions"><button class="btn primary" onclick="resolveConflict()">${act}</button>

function setTask(mode,t,quiet){
  S.task[mode]=t;pushRecent(t);

    if(mode==='tracker'&&elapsed(a)>=TRACK_MIN_SAVE&&(a.task.cat!==t.cat||a.task.name!==t.name)){
      const prev=a.task.name,sec=Math.round(elapsed(a)/1000),running=!!a.runStart;

      if(running)wake();

function vTimer(){

    <button aria-pressed="${vm==='tracker'}" onclick="setMode('tracker')"><b>Time Tracker</b><small>Counts up</small></button></div>`;

  const chip=isBreak
    ?`<div class="msgcard"><p class="eyebrow">${esc(S.msg?S.msg.title:'Break time')}</p><p class="msg">${esc(S.msg?S.msg.text:'Step away from the screen for a few minutes.')}</p></div>`

  let state,sub;

    state=isBreak?(mine.kind==='long'?'Long break':'Short break'):mine?(running?'Focusing':'Paused'):'Ready';
    sub=isBreak?`${mine.min} min · breathe`:`Session ${Math.min(c.n+1,999)} today`;
  }else{
    state=mine?(running?'Tracking':'Paused'):'Ready';
    sub='<span id="hourSub"></span>';
  }
  const ring=`<div class="ringwrap">${ringSVG()}<div class="ringcenter"><div class="state">${state}</div><div class="digits num${vm==='tracker'?' long':''}" id="digits"></div><div class="ringsub">${sub}</div></div></div>`;
  const dots=vm==='focus'?`<div class="dots" aria-label="${filled} of ${every} sessions before a long break">${Array.from({length:every},(_,i)=>`<span class="${i<filled?'on':''}"></span>`).join('')}</div>`:'';

  const dur=(vm==='focus'&&!mine)?`<div class="dur"><div class="durhead"><label for="durSlider">Focus length</label><output id="durOut" class="num">${S.settings.focusMin} min</output></div>
    <input type="range" id="durSlider" min="5" max="60" step="5" value="${S.settings.focusMin}" oninput="setDur(this.value)">
    <div class="presets">${[15,25,45,60].map(m=>`<button data-m="${m}" class="${S.settings.focusMin===m?'on':''}" onclick="setDur(${m});$('#durSlider').value=${m}">${m}</button>`).join('')}</div></div>`:'';

  const pp=`<div class="ctlwrap"><button class="ctl main" onclick="play()" aria-label="${running?'Pause':'Start'}">${running?ICON.pause:ICON.play}</button>${running?'Pause':mine?'Resume':'Start'}</div>`;
  let ctl;
  if(vm==='focus'&&isBreak){
    ctl=`<div class="ctlwrap"><button class="ctl" onclick="skipBreak()" aria-label="Skip break">${ICON.skip}</button>Skip</div>${pp}<div class="ctlwrap"><button class="ctl" onclick="addMinute()" aria-label="Add one minute">${ICON.plus}</button>+1 min</div>`;
  }else if(vm==='focus'){
    ctl=`<div class="ctlwrap"><button class="ctl" onclick="resetFocus()" aria-label="Reset" ${mine?'':'disabled'}>${ICON.reset}</button>Reset</div>${pp}<div class="ctlwrap"><button class="ctl" onclick="soundTap()" onpointerdown="lpStart()" onpointerup="lpEnd()" onpointerleave="lpEnd()" onpointercancel="lpEnd()" oncontextmenu="event.preventDefault()" style="-webkit-touch-callout:none;user-select:none" aria-label="Sound on or off. Hold for sound settings.">${S.settings.sound?ICON.vol:ICON.mute}</button>${S.settings.sound?'Sound on':'Muted'}<small style="font-size:10px;opacity:.7;margin-top:-4px">Hold for options</small></div>`;
  }else{
    ctl=`<div class="ctlwrap"><button class="ctl" onclick="pickFor('tracker')" aria-label="Switch task">${ICON.swap}</button>Switch</div>${pp}<div class="ctlwrap"><button class="ctl" onclick="stopTracker()" aria-label="Stop and save" ${mine?'':'disabled'}>${ICON.stop}</button>Stop &amp; save</div>`;
  }

  const note=isBreak?'':`<input type="text" class="note" id="note-${vm}" maxlength="120" placeholder="Note (optional): client, job number, detail" value="${esc(S.notes[vm])}" oninput="S.notes[S.ui.mode]=this.value;save()">`;

  let minis;
  if(vm==='focus'){
    const f=td.filter(e=>e.mode==='focus');
    minis=`<div class="mini"><b>${f.filter(e=>e.completed).length}</b><span>Sessions today</span></div><div class="mini"><b>${fmtDur(sumSec(f))}</b><span>Focus today</span></div><div class="mini"><b>${streakInfo().cur}</b><span>Weekday streak</span></div>`;
  }else{
    const onTask=t?sumSec(S.entries.filter(e=>e.cat===t.cat&&e.task===t.name)):0;
    const tdTask=t?sumSec(td.filter(e=>e.cat===t.cat&&e.task===t.name)):0;
    minis=`<div class="mini"><b>${fmtDur(tdTask)}</b><span>Task today</span></div><div class="mini"><b>${fmtDur(onTask)}</b><span>Task all-time</span></div><div class="mini"><b>${fmtDur(sumSec(td))}</b><span>All logged today</span></div>`;
  }

  let extra='';
  if(vm==='focus'&&S.settings.clock){
    if(isBreak)extra=`<button class="btn ghost block" onclick="runClock(breakMinLeft())">Time the break on iPhone Clock</button>`;
    else if(!mine)extra=`<p class="hint">Start also sets your iPhone Clock timer for ${S.settings.focusMin} min.</p>`;
  }
  if(vm==='focus'&&!isBreak&&S.settings.pad!=='off')extra+=`<p class="hint">Deep pad plays during the session. Hold the sound button to change it.</p>`;
  return `${TEST?'<p class="testbar">Test mode: timer minutes run as seconds</p>':''}${sw}${chip}${ring}${dots}${dur}<div class="controls">${ctl}</div>${extra}${note}<div class="minis">${minis}</div>`;
}

/* ---------- streaks ---------- */
function streakInfo(){
  const done=new Set(S.entries.filter(e=>e.mode==='focus'&&e.completed).map(e=>dayKey(e.start)));
  let d=sod(new Date()),cur=0,first=true;
  for(let i=0;i<4000;i++){
    if(!isWE(d)){
      if(done.has(dayKey(d)))cur++;
      else if(!first)break;
    }
    first=false;d=addDays(d,-1);
  }
  let best=cur,run=0;
  const keys=[...done].sort();
  if(keys.length){
    let x=sod(new Date(keys[0]+'T00:00')),end=sod(new Date());
    while(x<=end){
      if(!isWE(x)){if(done.has(dayKey(x))){run++;best=Math.max(best,run)}else if(dayKey(x)!==dayKey(end))run=0}
      x=addDays(x,1);
    }
  }
  return{cur,best,done};
}

/* ---------- dashboard ---------- */
function rangeBounds(){
  const now=new Date(),r=S.ui.range;
  if(r==='today'){const f=sod(now);return[f.getTime(),f.getTime()+DAY,'Today, '+fmtDay(f)]}
  if(r==='week'){const f=monday(now);return[f.getTime(),addDays(f,7).getTime(),'This week, '+fmtDay(f)+' to '+fmtDay(addDays(f,6))]}
  if(r==='month'){const f=new Date(now.getFullYear(),now.getMonth(),1);return[f.getTime(),new Date(now.getFullYear(),now.getMonth()+1,1).getTime(),MON[f.getMonth()]+' '+f.getFullYear()]}
  const f=S.ui.cfrom?sod(new Date(S.ui.cfrom+'T00:00')):addDays(sod(now),-13);
  const t=S.ui.cto?addDays(sod(new Date(S.ui.cto+'T00:00')),1):addDays(sod(now),1);
  return[f.getTime(),Math.max(t.getTime(),f.getTime()+DAY),fmtDay(f)+' to '+fmtDay(addDays(t,-1))];
}
function setRange(r){S.ui.range=r;S.ui.cat=null;save();render()}
function selCat(c){S.ui.cat=S.ui.cat===c?null:c;save();render()}
function setCustom(){S.ui.cfrom=$('#cfrom').value;S.ui.cto=$('#cto').value;save();render()}

function sampleBanner(){
  return S.hasSample?`<div class="banner"><p><b>You're looking at sample data.</b> It clears automatically when you save your first real session.</p><button onclick="clearSample()">Clear now</button></div>`:'';
}
function clearSample(){S.entries=S.entries.filter(e=>!e.sample);S.hasSample=false;save();render();toast('Sample data cleared.')}

function vDash(){
  const[from,to,label]=rangeBounds();
  const es=S.entries.filter(e=>e.start>=from&&e.start<to);
  const tot=sumSec(es),fs=sumSec(es.filter(e=>e.mode==='focus')),ts=tot-fs;
  const sessions=es.filter(e=>e.mode==='focus'&&e.completed).length;
  const weDays=new Set(es.filter(e=>isWE(e.start)).map(e=>dayKey(e.start))).size;
  const byCat={};CATS.forEach(c=>byCat[c]=0);es.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.sec);
  const sel=S.ui.cat;
  const byTask={};es.filter(e=>!sel||e.cat===sel).forEach(e=>{const k=e.cat+'|'+e.task;(byTask[k]=byTask[k]||{cat:e.cat,task:e.task,f:0,t:0})[e.mode==='focus'?'f':'t']+=e.sec});
  const tasks=Object.values(byTask).sort((a,b)=>(b.f+b.t)-(a.f+a.t));
  const maxT=tasks.length?tasks[0].f+tasks[0].t:1;
  const h=Math.floor(tot/3600),m=Math.round(tot%3600/60);

  const rb=`<div class="rangebar">${[['today','Today'],['week','Week'],['month','Month'],['custom','Custom']].map(([k,l])=>`<button class="${S.ui.range===k?'on':''}" onclick="setRange('${k}')">${l}</button>`).join('')}</div>`;
  const custom=S.ui.range==='custom'?`<div class="grid2"><label class="field">From<input type="date" id="cfrom" value="${S.ui.cfrom}" onchange="setCustom()"></label><label class="field">To<input type="date" id="cto" value="${S.ui.cto}" onchange="setCustom()"></label></div>`:'';

  const totalSec=`<section class="total"><p class="eyebrow">${S.settings.userName?esc(S.settings.userName)+' · ':''}${esc(label)}</p>
    <div class="big">${h}<small>h</small>${m}<small>m</small></div>
    <div class="splitbar" aria-hidden="true"><span style="width:${tot?fs/tot*100:0}%;background:var(--m-focus)"></span><span style="width:${tot?ts/tot*100:0}%;background:var(--m-tracker)"></span></div>
    <div class="splitlegend"><span><i style="background:var(--m-focus)"></i>Focus ${fmtDur(fs)}</span><span><i style="background:var(--m-tracker)"></i>Time Tracker ${fmtDur(ts)}</span></div></section>`;

  const kpis=`<div class="minis"><div class="mini"><b>${sessions}</b><span>Focus sessions</span></div><div class="mini"><b>${streakInfo().cur}</b><span>Weekday streak</span></div><div class="mini"><b>${weDays}</b><span>Weekend days worked</span></div></div>`;

  if(!es.length)return `${sampleBanner()}${rb}${custom}${totalSec}<div class="card"><p class="empty">Nothing logged in this period yet. Start a focus session or the Time Tracker and it shows up here.</p></div>`;

  // donut
  const r=62,Cd=2*Math.PI*r;let off=0;
  const cats=CATS.filter(c=>byCat[c]>0);const gap=cats.length>1?3:0;
  const segs=cats.map(c=>{const len=byCat[c]/tot*Cd;const s=`<circle class="seg ${sel&&sel!==c?'dim':''}" cx="80" cy="80" r="${r}" fill="none" style="stroke:${CATVAR[c]}" stroke-width="22" stroke-dasharray="${Math.max(.5,len-gap).toFixed(2)} ${Cd.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)" onclick="selCat('${c}')"><title>${c}: ${fmtDur(byCat[c])}</title></circle>`;off+=len;return s}).join('');
  const centerV=sel?byCat[sel]:tot;
  const donut=`<svg class="donut" viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Time by category">${segs}
    <text x="80" y="78" text-anchor="middle" style="fill:var(--ink);font:800 22px var(--f-display)">${fmtDur(centerV)}</text>
    <text x="80" y="98" text-anchor="middle" style="fill:var(--muted);font:700 10px var(--f-body);letter-spacing:.12em">${sel?esc(sel.toUpperCase()):'TOTAL'}</text></svg>`;
  const legend=`<div class="legend">${CATS.map(c=>`<button class="${sel===c?'on':''} ${sel&&sel!==c?'dim':''}" onclick="selCat('${c}')" ${byCat[c]?'':'disabled'}><span class="cdot" style="background:${CATVAR[c]}"></span><span>${c}</span><span class="v">${fmtDur(byCat[c])}<span class="pc">${tot?Math.round(byCat[c]/tot*100):0}%</span></span></button>`).join('')}</div>`;

  const bars=`<div class="bars">${tasks.slice(0,12).map(x=>`<div class="barrow"><div class="lbl"><span><span class="cdot" style="display:inline-block;width:8px;height:8px;margin-right:8px;background:${CATVAR[x.cat]}"></span>${esc(x.task)}</span><span class="v">${fmtDur(x.f+x.t)}</span></div>
    <div class="track"><span style="width:${x.f/maxT*100}%;background:var(--m-focus)"></span><span style="width:${x.t/maxT*100}%;background:var(--m-tracker)"></span></div></div>`).join('')}</div>`;

  const time=S.ui.range==='today'?timeline(es,from):dayBars(es,from,to);

  return `${sampleBanner()}${rb}${custom}${totalSec}${kpis}
  <section class="card"><div class="cardhead"><h4>Where the time went</h4><span class="eyebrow">Tap to drill in</span></div><div class="donutrow">${donut}${legend}</div></section>
  <section class="card"><div class="cardhead"><h4>${sel?esc(sel)+' tasks':'All tasks'}</h4>${sel?`<button class="eyebrow" style="color:var(--accent)" onclick="selCat('${sel}')">Show all</button>`:`<span class="eyebrow">Focus + tracked</span>`}</div>${bars}</section>
  <section class="card"><div class="cardhead"><h4>${S.ui.range==='today'?"Today's timeline":'Day by day'}</h4><span class="eyebrow">${S.ui.range==='today'?'Focus / Tracker':'Hours'}</span></div>${time}</section>`;
}
function timeline(es,dayStart){
  let h0=7,h1=18;
  es.forEach(e=>{h0=Math.min(h0,Math.floor((e.start-dayStart)/3.6e6));h1=Math.max(h1,Math.ceil((e.end-dayStart)/3.6e6))});
  h0=Math.max(0,h0);h1=Math.min(24,Math.max(h1,h0+4));
  const span=(h1-h0)*3.6e6,x=ts=>Math.max(0,Math.min(100,(ts-dayStart-h0*3.6e6)/span*100));
  const row=mode=>es.filter(e=>e.mode===mode).map(e=>`<span style="left:${x(e.start)}%;width:${Math.max(.8,x(e.end)-x(e.start))}%;background:${CATVAR[e.cat]}" title="${esc(e.task)} ${fmtTime(e.start)} to ${fmtTime(e.end)}"></span>`).join('');
  const nowX=x(Date.now());
  const now=Date.now()<dayStart+h1*3.6e6?`<i class="tlnow" style="left:${nowX}%"></i>`:'';
  let ax='';const step=(h1-h0)>10?3:2;
  for(let h=h0;h<=h1;h+=step){const hh=h%12||12;ax+=`<span style="left:${(h-h0)/(h1-h0)*100}%">${hh}${h<12||h===24?'a':'p'}</span>`}
  return `<div class="tl"><div class="tlrow">Focus<div class="tltrack">${row('focus')}${now}</div></div><div class="tlrow">Tracker<div class="tltrack">${row('tracker')}${now}</div></div><div class="tlaxis">${ax}</div></div>`;
}
function dayBars(es,from,to){
  const days=[];for(let d=new Date(from);d.getTime()<to;d=addDays(d,1))days.push({d:new Date(d),k:dayKey(d),f:0,t:0});
  const idx={};days.forEach((x,i)=>idx[x.k]=i);
  es.forEach(e=>{const i=idx[dayKey(e.start)];if(i!=null)days[i][e.mode==='focus'?'f':'t']+=e.sec/3600});
  const maxH=Math.max(1,...days.map(x=>x.f+x.t));
  const step=maxH<=4?1:maxH<=8?2:maxH<=16?4:6;const top=Math.ceil(maxH/step)*step;
  const W=340,H=170,pl=26,pb=20,pt=8,iw=W-pl-4,ih=H-pb-pt,bw=iw/days.length,gap=Math.min(6,bw*.25);
  const y=v=>pt+ih-v/top*ih;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end" style="fill:var(--muted)">${v}h</text>`;
  const today=dayKey(Date.now());
  const b=days.map((x,i)=>{
    const bx=pl+i*bw+gap/2,w=Math.max(1,bw-gap);
    const we=isWE(x.d)?`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" style="fill:var(--card)"/>`:'';
    const hf=x.f/top*ih,ht=x.t/top*ih;
    const lblEvery=days.length<=10?1:days.length<=20?2:5;
    const lbl=(i%lblEvery===0||x.k===today)?`<text x="${bx+w/2}" y="${H-5}" text-anchor="middle" style="fill:${x.k===today?'var(--ink)':'var(--muted)'}">${days.length<=7?DOW[x.d.getDay()].slice(0,2):x.d.getDate()}</text>`:'';
    return `${we}<rect x="${bx}" y="${y(x.f+x.t)}" width="${w}" height="${ht}" rx="${Math.min(3,w/3)}" style="fill:var(--m-tracker)"><title>${fmtDay(x.d)}: ${fmtDur((x.f+x.t)*3600)}</title></rect><rect x="${bx}" y="${y(x.f)}" width="${w}" height="${hf}" style="fill:var(--m-focus)"/>${lbl}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours per day, focus and tracked">${g}${b}</svg>
  <div class="splitlegend"><span><i style="background:var(--m-focus)"></i>Focus</span><span><i style="background:var(--m-tracker)"></i>Time Tracker</span><span class="muted"><i style="background:var(--card);border:1px solid var(--line)"></i>Weekend</span></div>`;
}

/* ---------- stats ---------- */
function vStats(){
  const si=streakInfo(),today=sod(new Date()),mon=monday(today);
  const wk=S.entries.filter(e=>e.start>=mon.getTime()&&e.start<addDays(mon,7).getTime());
  const wf=wk.filter(e=>e.mode==='focus');
  const done=wf.filter(e=>e.completed);
  const td=todayEntries().filter(e=>e.mode==='focus'&&e.completed).length;
  const avg=done.length?sumSec(done)/done.length:0;

  const strip=Array.from({length:7},(_,i)=>{const d=addDays(mon,i),k=dayKey(d),has=si.done.has(k);
    return `<div><i class="${has?'done':''} ${isWE(d)?'we':''} ${k===dayKey(today)?'today':''}">${has?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>':''}</i>${DOW[d.getDay()].slice(0,2)}</div>`}).join('');

  // heatmap: 12 weeks, Mon..Sun rows
  const start=addDays(mon,-77);const perDay={};
  S.entries.forEach(e=>{const k=dayKey(e.start);perDay[k]=(perDay[k]||0)+e.sec});
  let heat='';const dn=['M','','W','','F','','S'];
  for(let r=0;r<7;r++){
    heat+=`<span class="dl">${dn[r]}</span>`;
    for(let w=0;w<12;w++){
      const d=addDays(start,w*7+r),k=dayKey(d),s=perDay[k]||0;
      const lv=d>today?'fut':s===0?'':s<3600?'l1':s<7200?'l2':s<14400?'l3':'l4';
      heat+=`<span class="c ${lv}" title="${fmtDay(d)}: ${fmtDur(s)}"></span>`;
    }
  }
  const byTask={};wk.forEach(e=>{const k=e.cat+'|'+e.task;(byTask[k]=byTask[k]||{cat:e.cat,task:e.task,s:0}).s+=e.sec});
  const top=Object.values(byTask).sort((a,b)=>b.s-a.s).slice(0,5);
  const toLong=S.settings.longEvery-(cycleToday().n%S.settings.longEvery);

  return `${sampleBanner()}
  <section class="card"><div class="streak"><div class="n">${si.cur}</div><div class="t"><b>weekday streak</b><span class="muted">Best ${si.best}. Each weekday needs one completed focus session. Weekends never break it.</span></div></div>
  <div class="weekstrip">${strip}</div></section>
  <div class="minis"><div class="mini"><b>${td}</b><span>Sessions today</span></div><div class="mini"><b>${done.length}</b><span>Sessions this week</span></div><div class="mini"><b>${fmtDur(avg)}</b><span>Avg session</span></div></div>
  <div class="minis"><div class="mini"><b>${fmtDur(sumSec(wf))}</b><span>Focus this week</span></div><div class="mini"><b>${fmtDur(sumSec(wk)-sumSec(wf))}</b><span>Tracked this week</span></div><div class="mini"><b>${toLong}</b><span>To long break</span></div></div>
  <section class="card"><div class="cardhead"><h4>Last 12 weeks</h4><span class="eyebrow">All logged time</span></div><div class="heat">${heat}</div>
  <div class="heatkey">Less <span class="c" style="background:var(--track)"></span><span class="c l1"></span><span class="c l2"></span><span class="c l3"></span><span class="c l4"></span> 4h+</div></section>
  <section class="card"><div class="cardhead"><h4>Top tasks this week</h4><button class="eyebrow" style="color:var(--accent)" onclick="go('dash')">Dashboard</button></div>
  ${top.length?`<div class="bars">${top.map(x=>`<div class="barrow"><div class="lbl"><span><span class="cdot" style="display:inline-block;width:8px;height:8px;margin-right:8px;background:${CATVAR[x.cat]}"></span>${esc(x.task)}</span><span class="v">${fmtDur(x.s)}</span></div><div class="track"><span style="width:${x.s/top[0].s*100}%;background:${CATVAR[x.cat]}"></span></div></div>`).join('')}</div>`:'<p class="empty">No time logged this week yet.</p>'}</section>`;
}

/* ---------- log ---------- */
function vLog(){
  const list=S.entries.slice().sort((a,b)=>b.start-a.start);
  const shown=list.slice(0,S.ui.logLimit);
  const groups={};shown.forEach(e=>{(groups[dayKey(e.start)]=groups[dayKey(e.start)]||[]).push(e)});
  const dayTot={};list.forEach(e=>{const k=dayKey(e.start);dayTot[k]=(dayTot[k]||0)+e.sec});
  const html=Object.keys(groups).map(k=>`<div class="daygrp"><div class="dayhead"><span>${k===dayKey(Date.now())?'Today':fmtDay(groups[k][0].start)}</span><span class="num">${fmtDur(dayTot[k])}</span></div>
    ${groups[k].map(e=>`<button class="logrow" onclick="editEntry('${e.id}')"><span class="cdot" style="background:${CATVAR[e.cat]||'var(--muted)'}"></span><span class="m"><b>${esc(e.task)}</b>
      <small>${e.manual?'<span class="tag manual">Manual</span>':''}<span class="tag ${e.mode==='focus'&&!e.completed?'partial':e.mode}">${e.mode==='focus'?(e.completed?'Focus':'Partial'):'Tracker'}</span>${esc(e.cat)} · ${fmtTime(e.start)} to ${fmtTime(e.end)}</small>
      ${e.note?`<em>${esc(e.note)}</em>`:''}</span><span class="d">${fmtDur(e.sec)}</span></button>`).join('')}</div>`).join('');
  return `${sampleBanner()}<button class="btn primary block" onclick="editEntry()">${ICON.plus.replace('<svg','<svg width="20" height="20"')} Add past entry</button>
  ${html||'<div class="card"><p class="empty">Your log is empty. Sessions and tracked time appear here, and you can add time you forgot to track.</p></div>'}
  ${list.length>shown.length?`<button class="btn ghost block" onclick="S.ui.logLimit+=40;render()">Show older entries</button>`:''}`;
}
let draft=null;
function editEntry(id){
  const e=id&&S.entries.find(x=>x.id===id);
  if(e){const d=new Date(e.start);draft={id:e.id,mode:e.mode,cat:e.cat,task:e.task,date:dayKey(e.start),time:hhmm(e.start),h:Math.floor(e.sec/3600),m:Math.round(e.sec%3600/60),note:e.note||'',completed:!!e.completed,manual:!!e.manual}}
  else{
    const t=S.task.tracker||S.task.focus;const st=new Date(Date.now()-3600000);st.setMinutes(st.getMinutes()<30?0:30);
    draft={id:null,mode:'tracker',cat:t?t.cat:null,task:t?t.name:null,date:dayKey(st),time:hhmm(st),h:1,m:0,note:'',completed:true,manual:true};
  }
  draft.err='';draft.delArm=false;
  openSheet(editHTML());
}
function readDraft(){
  if(!$('#edDate'))return;
  draft.date=$('#edDate').value;draft.time=$('#edTime').value;draft.h=+$('#edH').value||0;draft.m=+$('#edM').value||0;draft.note=$('#edNote').value;
  const c=$('#edDone');if(c)draft.completed=c.checked;
}
function editHTML(){
  const d=draft;
  return `<h3>${d.id?'Edit entry':'Add past entry'}</h3>
  <div class="field">Task<button class="taskchip" onclick="readDraft();openPicker(t=>{draft.cat=t.cat;draft.task=t.name;setSheet(editHTML())},draft.cat?{cat:draft.cat,name:draft.task}:null)">${d.task?`<span class="cdot" style="background:${CATVAR[d.cat]}"></span><span class="tc-text"><small>${esc(d.cat)}</small><b>${esc(d.task)}</b></span>`:`<span class="cdot" style="background:var(--muted)"></span><span class="tc-text"><small>Task</small><b>Choose a task</b></span>`}<span class="tc-act">Change</span></button></div>
  <div class="field">Type<div class="rangebar">${[['focus','Focus session'],['tracker','Tracked time']].map(([k,l])=>`<button class="${d.mode===k?'on':''}" onclick="readDraft();draft.mode='${k}';setSheet(editHTML())">${l}</button>`).join('')}</div></div>
  <div class="grid2"><label class="field">Date<input type="date" id="edDate" value="${d.date}"></label><label class="field">Start time<input type="time" id="edTime" value="${d.time}"></label></div>
  <div class="grid2"><label class="field">Hours<input type="number" id="edH" min="0" max="23" inputmode="numeric" value="${d.h}"></label><label class="field">Minutes<input type="number" id="edM" min="0" max="59" inputmode="numeric" value="${d.m}"></label></div>
  ${d.mode==='focus'?`<label class="check"><input type="checkbox" id="edDone" ${d.completed?'checked':''}> Completed session (counts toward the streak)</label>`:''}
  <label class="field">Note<input type="text" id="edNote" maxlength="120" value="${esc(d.note)}" placeholder="Optional"></label>
  ${d.err?`<p class="err">${esc(d.err)}</p>`:''}
  <div class="actions"><button class="btn primary" onclick="saveDraft()">${d.id?'Save changes':'Add entry'}</button>
  ${d.id?`<button class="btn danger" onclick="delDraft()">${d.delArm?'Tap again to delete':'Delete entry'}</button>`:''}
  <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`;
}
function saveDraft(){
  readDraft();const d=draft;
  const sec=(d.h*60+d.m)*60;
  const start=new Date(d.date+'T'+(d.time||'09:00')).getTime();
  d.err=!d.task?'Choose a task first.':!sec?'Enter how long you worked.':isNaN(start)?'Enter a valid date and start time.':start>Date.now()?'That start time is in the future. Pick an earlier time.':'';
  if(d.err){setSheet(editHTML());return}
  const e={id:d.id||uid(),mode:d.mode,cat:d.cat,task:d.task,start,end:start+sec*1000,sec,completed:d.mode==='focus'&&d.completed,note:d.note.trim(),manual:d.manual};
  if(d.id){const i=S.entries.findIndex(x=>x.id===d.id);if(i>-1){e.sample=S.entries[i].sample;S.entries[i]=e}}
  else addEntry(e);
  pushRecent({cat:d.cat,name:d.task});
  save();closeSheet();render();toast(d.id?'Entry updated.':`Added ${fmtDur(sec)} on ${d.task}.`);
}
function delDraft(){
  if(!draft.delArm){readDraft();draft.delArm=true;setSheet(editHTML());return}
  S.entries=S.entries.filter(x=>x.id!==draft.id);save();closeSheet();render();toast('Entry deleted.');
}

function setNotify(inp){
  if(!inp.checked){S.settings.notify=false;save();toast('Pop-up notifications off.');return}
  const fail=msg=>{inp.checked=false;S.settings.notify=false;save();toast(msg)};
  try{

    Notification.requestPermission().then(p=>{
      if(p==='granted'){S.settings.notify=true;save();toast('Pop-up notifications on.')}
      else fail('Notifications are blocked for this site in your browser settings. Sound and vibration still work.');

  }catch(e){fail('Notifications are blocked here. Sound and vibration still work.')}
}

let eraseArm=0;
function eraseAll(btn){
  if(Date.now()-eraseArm>4000){eraseArm=Date.now();btn.textContent='Tap again to erase all entries';return}
  const keep=S.settings;S=defaults();S.settings=keep;save();render();toast('All entries erased.');
}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportRows(){
  const head=['id','user','date','start','end','mode','category','task','minutes','completed','manual','note'];
  const rows=S.entries.filter(e=>!e.sample).sort((a,b)=>a.start-b.start).map(e=>[e.id,S.settings.userName||'',dayKey(e.start),hhmm(e.start),hhmm(e.end),e.mode,e.cat,e.task,(e.sec/60).toFixed(1),e.completed?'yes':'no',e.manual?'yes':'no',e.note||'']);
  return[head,...rows];
}
function exportSheet(){
  const rows=exportRows();const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  openSheet(`<h3>Export your log</h3><p class="muted">${rows.length-1} entries. Copy the CSV and save it as a .csv file, or copy the Excel version and paste it straight into a spreadsheet.</p>
  <textarea id="csvOut" rows="8" readonly aria-label="CSV export">${esc(csv)}</textarea>
  <div class="actions"><button class="btn primary" onclick="copyOut('csv')">Copy CSV</button><button class="btn ghost" onclick="copyOut('tsv')">Copy for Excel</button><button class="btn ghost" onclick="closeSheet()">Done</button></div>`);
}
function copyOut(kind){
  const rows=exportRows();
  const text=kind==='tsv'?rows.map(r=>r.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n'):rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const ta=$('#csvOut');
  const fallback=()=>{ta.value=text;ta.focus();ta.select();toast('Text selected. Use Copy from your keyboard or menu.')};
  try{navigator.clipboard.writeText(text).then(()=>toast(kind==='tsv'?'Copied. Paste into Excel.':'CSV copied.')).catch(fallback)}catch(e){fallback()}
}
function importSheet(){
  openSheet(`<h3>Import CSV</h3><p class="muted">Use a file exported from FocusFlow. Entries with the same id are updated, new ones are added.</p>
  <input type="file" id="impFile" accept=".csv,text/csv,text/plain" onchange="readImp(this)">
  <textarea id="impText" rows="6" placeholder="Or paste CSV text here" aria-label="CSV to import"></textarea>
  <p class="err" id="impErr"></p>
  <div class="actions"><button class="btn primary" onclick="doImport()">Import</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}
function readImp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impText').value=r.result};r.readAsText(f)}
function parseCSV(t){
  const sep=t.split('\n')[0].includes('\t')?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function doImport(){
  const rows=parseCSV($('#impText').value||'');const err=$('#impErr');
  if(rows.length<2){err.textContent='No rows found. Choose a FocusFlow CSV file or paste its contents.';return}
  const h=rows[0].map(x=>x.trim().toLowerCase());const col=n=>h.indexOf(n);
  if(col('date')<0||col('task')<0||col('minutes')<0){err.textContent='This file is missing the date, task or minutes column.';return}
  let added=0,upd=0,bad=0;
  if(S.hasSample){S.entries=S.entries.filter(e=>!e.sample);S.hasSample=false}
  rows.slice(1).forEach(r=>{
    const g=n=>col(n)>-1?(r[col(n)]||'').trim():'';
    const start=new Date(g('date')+'T'+(g('start')||'09:00')).getTime(),sec=Math.round(parseFloat(g('minutes'))*60);
    if(isNaN(start)||!sec||!g('task')){bad++;return}
    const cat=CATS.includes(g('category'))?g('category'):'Other';
    const e={id:g('id')||uid(),mode:g('mode')==='focus'?'focus':'tracker',cat,task:g('task'),start,end:start+sec*1000,sec,completed:g('completed')==='yes',manual:g('manual')==='yes',note:g('note')};
    if(cat==='Other'&&!S.adhoc.includes(e.task))S.adhoc.push(e.task);
    const i=S.entries.findIndex(x=>x.id===e.id);if(i>-1){S.entries[i]=e;upd++}else{S.entries.push(e);added++}
  });
  save();closeSheet();render();toast(`Imported ${added} new, updated ${upd}${bad?`, skipped ${bad}`:''}.`);
}

/* ---------- render loop ---------- */
function render(){
  const vm=S.ui.mode,a=S.active;
  const theme=vm==='tracker'?'tracker':(a&&a.mode==='break'?'break':'focus');
  document.body.dataset.theme=theme;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=theme==='tracker'?'#D8622A':theme==='break'?'#314C98':'#0F1839';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.ui.view));
  const views={timer:vTimer,dash:vDash,stats:vStats,log:vLog,settings:vSettings};
  $('#main').innerHTML=(views[S.ui.view]||vTimer)();
  paintTimer();paintPill();syncPad();syncLock();
}
function tick(){
  const a=S.active;
  if(a&&a.runStart&&a.target&&elapsed(a)>=a.target){a.mode==='focus'?completeFocus():completeBreak();return}
  paintTimer();paintPill();syncLock();
}
// Called by the service worker loader (index.html) when a new version has been downloaded
window.ffUpdateReady=()=>{
  const b=$('#update');if(!b)return;
  b.hidden=false;
  b.innerHTML=`<span>A new version of the app is ready.</span><button onclick="location.reload()">Update now</button>`;
};
setInterval(tick,250);
addEventListener('scroll',()=>{const h=$('header.top');if(h)h.classList.toggle('scrolled',scrollY>4)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.active&&S.active.runStart)wake()}});
render();
</script>

<script>
if('serviceWorker' in navigator){
  // Check for a new version on launch and whenever the app comes back to the foreground.
  let hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&window.ffUpdateReady)window.ffUpdateReady();hadController=true});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
